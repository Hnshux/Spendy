<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendy | SAARVAIN</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #6c5ce7;
            --biz-panel: linear-gradient(135deg, #4b6cb7, #182848);
            --pers-panel: linear-gradient(135deg, #667eea, #764ba2);
            --accent: #00cec9;
            --bg-light: #f8fafc;
            --text-dark: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }

        .bg-blob { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.3; animation: float 15s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #a29bfe; }
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #81ecec; }
        @keyframes float { from { transform: translate(0,0); } to { transform: translate(40px, 40px); } }

        #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: #fff; transition: 0.5s; }

        .app-container { width: 100%; max-width: 1300px; margin: 0 auto; min-height: 100vh; background: rgba(255,255,255,0.6); backdrop-filter: blur(20px); display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,0.05); }

        #home-page { padding: 80px 25px; text-align: center; max-width: 450px; margin: 0 auto; }
        .app-title { font-size: 45px; font-weight: 900; margin-bottom: 50px; }
        .app-title span { color: var(--primary); }
        
        .home-btn { width: 100%; padding: 22px; margin-bottom: 18px; border-radius: 24px; border: none; cursor: pointer; color: #fff; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        #main-app { display: none; padding: 0 20px; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 25px 0; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 30px; }
        @media (min-width: 1024px) { .dashboard-grid { grid-template-columns: 350px 1fr 320px; } }

        .panel { background: rgba(255,255,255,0.9); border-radius: 28px; padding: 25px; border: 1px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        .hero-box { border-radius: 22px; padding: 35px 20px; color: #fff; text-align: center; margin-bottom: 20px; }
        .hero-box h1 { font-size: 34px; font-weight: 800; }

        input { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #edf2f7; border-radius: 15px; outline: none; background: #fff; font-size: 16px; }
        .add-btn { width: 100%; padding: 16px; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; color: #fff; }

        .category-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .chip { padding: 8px 16px; background: #f1f5f9; border-radius: 12px; font-size: 12px; cursor: pointer; white-space: nowrap; font-weight: 600; }
        .chip.selected { background: var(--text-dark); color: #fff; }

        .history-list { max-height: 550px; overflow-y: auto; }
        .item-card { display: flex; justify-content: space-between; padding: 18px; background: #fff; border-radius: 20px; margin-bottom: 12px; border: 1px solid #f1f5f9; }
        .item-info b { display: block; font-size: 16px; }
        .item-info small { color: #94a3b8; font-size: 11px; display: block; margin-top: 4px; }
        .item-price { color: #eb4d4b; font-weight: 800; font-size: 17px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 8000; backdrop-filter: blur(10px); }
        .modal-content { background: #fff; width: 90%; max-width: 380px; padding: 35px; border-radius: 35px; text-align: center; }

        footer { text-align: center; padding: 40px; font-size: 10px; color: #94a3b8; font-weight: 800; letter-spacing: 3px; }
    </style>
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<div id="splash">
    <div style="font-size: 10px; letter-spacing: 8px; margin-bottom: 10px; opacity: 0.6;">SAARVAIN</div>
    <div style="font-size: 36px; font-weight: 800;">SPENDY</div>
</div>

<div class="app-container" id="app-container" style="display:none;">
    <div id="home-page">
        <h1 class="app-title">SPENDY<span>.</span></h1>
        <button class="home-btn" style="background: var(--pers-panel);" onclick="openMode('personal')">
            <span>👤 Personal Wallet</span> <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button class="home-btn" style="background: var(--biz-panel);" onclick="triggerBizMode()">
            <span>💼 Business Pro 👑</span> <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <div id="main-app">
        <div class="header-bar">
            <button onclick="goHome()" style="background:none; border:none; font-weight:700; color:#64748b; cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> BACK</button>
            <div style="text-align: center; cursor: pointer;" onclick="editBizProfile()">
                <b style="font-size: 18px;">SPENDY <i id="edit-pen" class="fa-solid fa-pen-to-square" style="font-size: 10px; display:none; color: var(--primary);"></i></b>
            </div>
            <button onclick="exportToPDF()" style="background:none; border:none; color:var(--primary); font-weight:800; cursor:pointer;">PDF <i class="fa-solid fa-download"></i></button>
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <div id="hero" class="hero-box">
                    <p id="hero-label">BALANCE</p>
                    <h1 id="total-display">₹0</h1>
                </div>
                <div id="p-budget-box">
                    <p style="font-size: 11px; margin-bottom: 5px; font-weight: bold;">MONTHLY BUDGET</p>
                    <input type="number" id="budgetInput" placeholder="Ex: 25000" oninput="saveBudget()">
                </div>
                <div id="cat-section" style="display:none;">
                    <p style="font-size: 11px; margin-bottom: 5px; font-weight: bold;">CATEGORY</p>
                    <div class="category-scroll">
                        <div class="chip selected" onclick="setCat('Other', this)">Other</div>
                        <div class="chip" onclick="setCat('Porter', this)">📦 Porter</div>
                        <div class="chip" onclick="setCat('Staff', this)">👥 Staff</div>
                    </div>
                </div>
                <input type="text" id="desc" placeholder="Spent on what?">
                <input type="number" id="amt" placeholder="Amount (₹)">
                <button id="main-add-btn" class="add-btn" onclick="addEntry()">Add Transaction</button>
            </div>

            <div class="panel">
                <h4 style="margin-bottom: 20px;">History</h4>
                <div id="list" class="history-list"></div>
            </div>

            <div id="chart-panel" class="panel">
                <h4 style="margin-bottom: 20px; text-align: center;">Breakdown</h4>
                <canvas id="spendChart"></canvas>
                <div id="no-data-msg" style="text-align: center; color: #999; margin-top: 30px;">No data yet</div>
            </div>
        </div>
        <footer>POWERED BY SAARVAIN</footer>
    </div>
</div>

<div id="payment-modal" class="modal-overlay">
    <div class="modal-content">
        <div style="font-size: 40px; margin-bottom: 10px;">👑</div>
        <h2>Unlock Business Pro</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">Unlock Business Analytics & PDF Reports.</p>
        <div style="background: #f1f5f9; padding: 15px; border-radius: 20px; margin-bottom: 20px;">
            <span style="font-size: 24px; font-weight: 800;">₹49</span>
        </div>
        
        <button class="add-btn" style="background: var(--primary); margin-bottom: 15px;" onclick="window.open('https://cosmofeed.com/vp/your-link', '_blank')">PAY NOW</button>
        
        <div style="border-top: 1px solid #eee; padding-top: 15px; margin-top: 10px;">
            <p style="font-size: 10px; font-weight: bold; margin-bottom: 8px;">ALREADY PAID? ENTER KEY:</p>
            <input type="text" id="activationCode" placeholder="Secret Key" style="text-align: center; border: 2px solid #edf2f7;">
            <button id="activate-btn" class="add-btn" style="background: #000; padding: 12px;" onclick="checkActivationCode()">Activate Pro</button>
        </div>

        <button onclick="closeModals()" style="background:none; border:none; color:#94a3b8; cursor:pointer; margin-top: 20px; font-size: 13px; font-weight: 600;">
            <i class="fa-solid fa-arrow-left"></i> Maybe Later / Back
        </button>
    </div>
</div>

<div id="biz-info-modal" class="modal-overlay">
    <div class="modal-content">
        <h3>Business Details</h3>
        <input type="text" id="modalBizName" placeholder="Shop Name">
        <input type="text" id="modalBizBranch" placeholder="Location">
        <button class="add-btn" style="background: #000;" onclick="saveBizDetails()">Open Dashboard</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB-fZ2qA8aB_-Ra3I3WHa6RuoYFm-QabRY",
        authDomain: "click-cha.firebaseapp.com",
        databaseURL: "https://click-cha-default-rtdb.firebaseio.com",
        projectId: "click-cha",
        storageBucket: "click-cha.firebasestorage.app",
        messagingSenderId: "231261928692",
        appId: "1:231261928692:web:76e53480670c49b40932a1",
        measurementId: "G-NZR6ZQQ1QZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = JSON.parse(localStorage.getItem('spendy_v7')) || { 
        pData: [], bData: [], pBudget: 0, bizName: "", bizBranch: "", isPro: false 
    };
    let currentMode = 'personal';
    let currentCat = 'Other';
    let myChart = null;

    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
        }, 500);
    }, 1500);

    function triggerBizMode() {
        if (state.isPro) {
            if (state.bizName && state.bizBranch) openMode('business');
            else document.getElementById('biz-info-modal').style.display = 'flex';
        } else document.getElementById('payment-modal').style.display = 'flex';
    }

    // --- ACTIVATION LOGIC WITH FRONT-POPUP FIX ---
    async function checkActivationCode() {
        const inputKey = document.getElementById('activationCode').value.trim();
        const btn = document.getElementById('activate-btn');

        if(!inputKey) {
            Swal.fire({ 
                icon: 'warning', 
                title: 'Khali hai!', 
                text: 'Bhai, key toh dalo pehle!', 
                confirmButtonColor: '#6c5ce7',
                didOpen: () => { Swal.getPopup().style.zIndex = '10000'; } // Modal ke upar lane ke liye
            });
            return;
        }

        btn.innerText = "Checking...";
        btn.disabled = true;

        try {
            const snapshot = await db.ref('spendy_keys/' + inputKey).once('value');
            const status = snapshot.val();

            if (status === "USED") {
                state.isPro = true; 
                save(); 
                Swal.fire({ 
                    title: 'CONGRATS!', 
                    text: 'Business Pro Unlock ho gaya. 👑', 
                    icon: 'success', 
                    confirmButtonColor: '#6c5ce7',
                    didOpen: () => { Swal.getPopup().style.zIndex = '10000'; }
                })
                .then(() => { closeModals(); triggerBizMode(); });
            } else {
                Swal.fire({ 
                    icon: 'error', 
                    title: 'WRONG CODE!', 
                    text: 'DM ON INSTA FOR CODE.', 
                    confirmButtonColor: '#eb4d4b',
                    didOpen: () => { Swal.getPopup().style.zIndex = '10000'; }
                });
            }
        } catch (error) {
            Swal.fire({ 
                icon: 'question', 
                title: 'Network Issue?', 
                text: 'Internet check karo bhai.', 
                confirmButtonColor: '#636e72',
                didOpen: () => { Swal.getPopup().style.zIndex = '10000'; }
            });
        } finally {
            btn.innerText = "Activate Pro";
            btn.disabled = false;
        }
    }

    function editBizProfile() { if(currentMode === 'business') document.getElementById('biz-info-modal').style.display = 'flex'; }
    function saveBizDetails() {
        state.bizName = document.getElementById('modalBizName').value || "My Biz";
        state.bizBranch = document.getElementById('modalBizBranch').value || "Main";
        save(); closeModals(); openMode('business');
    }
    function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

    function openMode(m) {
        currentMode = m;
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        const isBiz = m === 'business';
        document.getElementById('hero').style.background = isBiz ? 'var(--biz-panel)' : 'var(--pers-panel)';
        document.getElementById('cat-section').style.display = isBiz ? 'block' : 'none';
        document.getElementById('p-budget-box').style.display = isBiz ? 'none' : 'block';
        document.getElementById('chart-panel').style.opacity = isBiz ? '1' : '0';
        document.getElementById('main-add-btn').style.background = isBiz ? '#1e293b' : 'var(--primary)';
        document.getElementById('edit-pen').style.display = isBiz ? 'inline-block' : 'none';
        refresh();
    }

    function goHome() { document.getElementById('main-app').style.display = 'none'; document.getElementById('home-page').style.display = 'block'; }
    function setCat(c, el) { currentCat = c; document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('selected')); el.classList.add('selected'); }
    
    function addEntry() {
        const d = document.getElementById('desc').value, a = document.getElementById('amt').value;
        if(!d || !a) return;
        state[currentMode === 'personal' ? 'pData' : 'bData'].push({ d, a: parseFloat(a), cat: currentMode === 'business' ? currentCat : 'Personal', dt: new Date().toLocaleDateString('en-IN') });
        document.getElementById('desc').value = ''; document.getElementById('amt').value = ''; 
        save(); refresh();

        Swal.fire({ 
            toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, icon: 'success', title: 'Add ho gaya!',
            didOpen: () => { Swal.getPopup().style.zIndex = '10000'; }
        });
    }

    function saveBudget() { state.pBudget = parseFloat(document.getElementById('budgetInput').value) || 0; save(); refresh(); }
    function save() { localStorage.setItem('spendy_v7', JSON.stringify(state)); }

    function refresh() {
        const listDiv = document.getElementById('list'); listDiv.innerHTML = '';
        let total = 0, catTotals = {};
        const activeList = currentMode === 'personal' ? state.pData : state.bData;
        activeList.slice().reverse().forEach(item => {
            total += item.a;
            if(currentMode === 'business') catTotals[item.cat] = (catTotals[item.cat] || 0) + item.a;
            listDiv.innerHTML += `<div class="item-card"><div><b>${item.d}</b><small>${item.dt} • ${item.cat}</small></div><div class="item-price">₹${item.a.toLocaleString('en-IN')}</div></div>`;
        });
        document.getElementById('total-display').innerText = "₹" + (currentMode === 'personal' ? (state.pBudget - total) : total).toLocaleString('en-IN');
        if(currentMode === 'business') renderChart(catTotals);
    }

    function renderChart(data) {
        const ctx = document.getElementById('spendChart').getContext('2d');
        if(myChart) myChart.destroy();
        const keys = Object.keys(data);
        document.getElementById('no-data-msg').style.display = keys.length ? 'none' : 'block';
        if(!keys.length) return;
        myChart = new Chart(ctx, { type: 'doughnut', data: { labels: keys, datasets: [{ data: Object.values(data), backgroundColor: ['#6c5ce7', '#00cec9', '#ff7675', '#fdcb6e'], borderWidth: 0 }] }, options: { plugins: { legend: { position: 'bottom' } }, cutout: '70%' } });
    }

    function exportToPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        let total = 0;
        const data = currentMode === 'personal' ? state.pData : state.bData;
        data.forEach(i => total += i.a);
        doc.setFontSize(14); doc.setTextColor(100); doc.text("SAARVAIN // SPENDY", 14, 15);
        doc.setFontSize(10); doc.text(`Date: ${new Date().toLocaleDateString('en-IN')}`, 14, 22);
        if(currentMode === 'business') doc.text(`${state.bizName.toUpperCase()} (${state.bizBranch})`, 14, 32);
        const rows = data.map(i => [i.dt, i.cat, i.d, `Rs. ${i.a.toLocaleString('en-IN')}`]);
        doc.autoTable({ head: [['Date', 'Category', 'Description', 'Amount']], body: rows, startY: currentMode === 'business' ? 38 : 28, theme: 'grid', headStyles: { fillColor: [0, 0, 0] } });
        doc.save(`Spendy_Report.pdf`);
    }
</script>
</body>
</html>
