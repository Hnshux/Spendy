<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spendy- Your Activation Key</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .key { font-size: 1.5rem; font-weight: bold; color: #2563eb; background: #eff6ff; padding: 10px; border-radius: 8px; margin: 20px 0; border: 2px dashed #2563eb; cursor: pointer; }
        .note { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ONE TIME KEY 👑</h2>
        <p>Copy this code and paste it into the Spendy App:</p>
        <div id="keyDisplay" class="key">Generating...</div>
        <p class="note">Warning: This key will work only once. Do not refresh or close this page until you copy it.</p>
    </div>

    <script>
        var firebaseConfig = {
  apiKey: "AIzaSyB-fZ2qA8aB_-Ra3I3WHa6RuoYFm-QabRY",
  authDomain: "click-cha.firebaseapp.com",
  databaseURL: "https://click-cha-default-rtdb.firebaseio.com",
  projectId: "click-cha",
  storageBucket: "click-cha.firebasestorage.app",
  messagingSenderId: "231261928692",
  appId: "1:231261928692:web:76e53480670c49b40932a1",
  measurementId: "G-NZR6ZQQ1QZ"
};

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function fetchFreshKey() {
            try {
                const snapshot = await database.ref('spendy_keys').get();
                if (snapshot.exists()) {
                    const allKeys = snapshot.val();
                    // Sirf pehli VALID key dhundo
                    const validKey = Object.keys(allKeys).find(k => allKeys[k] === "VALID");

                    if (validKey) {
                        // Turant ise USED mark karo taaki koi aur na le sake
                        await database.ref('spendy_keys/' + validKey).set("USED");
                        document.getElementById('keyDisplay').innerText = validKey;
                    } else {
                        document.getElementById('keyDisplay').innerText = "Keys Exhausted! Contact Support.";
                    }
                }
            } catch (error) {
                document.getElementById('keyDisplay').innerText = "Error fetching key.";
            }
        }
        fetchFreshKey();
    </script>
</body>
</html>
